apiVersion: apps/v1
kind: Deployment
metadata:
  name: tidebook-indexer
  labels:
    app.kubernetes.io/name: tidebook-indexer
    app.kubernetes.io/component: indexer
    app.kubernetes.io/part-of: tidebook
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: tidebook-indexer
      app.kubernetes.io/component: indexer

  template:
    metadata:
      labels:
        app.kubernetes.io/name: tidebook-indexer
        app.kubernetes.io/component: indexer
        app.kubernetes.io/part-of: tidebook

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-postgres
          image: postgres:18.6
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB

          command:
            - sh
            - -c
            - |
              until pg_isready \
                --host postgres \
                --username "$POSTGRES_USER" \
                --dbname "$POSTGRES_DB"
              do
                echo "Waiting for PostgreSQL"
                sleep 2
              done

      containers:
        - name: indexer
          image: tidebook-indexer:dev

          # kind already has this local image. Do not attempt to pull the
          # development tag from Docker Hub.
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: indexer-config

            - secretRef:
                name: indexer-secrets

          ports:
            - name: health
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
