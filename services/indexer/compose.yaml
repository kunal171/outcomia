name: tidebook-indexer

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tidebook_indexer
      POSTGRES_USER: tidebook
      POSTGRES_PASSWORD: tidebook_dev
    ports:
      # Ports 5432 and 5433 are already used by other local PostgreSQL
      # services. Keep Tidebook isolated on loopback port 5434.
      - "127.0.0.1:5434:5432"
    volumes:
      - tidebook_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidebook -d tidebook_indexer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tidebook_postgres_data:
